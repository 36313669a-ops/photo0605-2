<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>攝影比賽作品展示</title>

<style>

body{
    margin:0;
    font-family:"Microsoft JhengHei";
    background:#f5f5f5;
}

header{
    text-align:center;
    padding:25px;
    background:white;
}

h1{ margin:0; }

/* ✅ 穩定網格（重點修正） */
.gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    padding:20px;
}

.item img{
    width:100%;
    height:auto;
    display:block;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    cursor:pointer;
}

.number{
    text-align:center;
    font-weight:bold;
    padding:5px 0;
}

@media(max-width:1000px){
    .gallery{ grid-template-columns:repeat(3,1fr); }
}

@media(max-width:768px){
    .gallery{ grid-template-columns:repeat(2,1fr); }
}

@media(max-width:480px){
    .gallery{ grid-template-columns:1fr; }
}

.vote-area{
    text-align:center;
    background:white;
    padding:40px 20px;
    margin-top:30px;
}

.vote-area img{
    width:220px;
    margin-top:10px;
}

/* 放大圖 */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal img{
    max-width:95%;
    max-height:95%;
}

</style>
</head>

<body>

<header>
    <h1>攝影比賽作品展示</h1>
</header>

<div class="gallery" id="gallery"></div>

<!-- ✔ QR CODE 區塊（你要的已加入） -->
<div class="vote-area">
    <h2>我要投票</h2>
    <p>請掃描 QR CODE 進入投票頁面</p>

    <!-- 你的 QR CODE -->
    <img src="qr.ioi.tw.png" alt="投票QR CODE">

    <p style="margin-top:10px;">
        或直接進入：<br>
        https://36313669a-ops.github.io/photo0605-2/vote.html
    </p>
</div>

<div class="modal" id="modal">
    <img id="modalImg">
</div>

<script>

const baseURL =
"https://36313669a-ops.github.io/photo0605-2/";

const gallery = document.getElementById('gallery');

for(let i=1;i<=59;i++){

    let num = String(i).padStart(3,'0');

    let div = document.createElement('div');
    div.className='item';

    div.innerHTML=`
        <img src="${baseURL}${num}.jpg" onclick="showImg(this.src)">
        <div class="number">${num}</div>
    `;

    gallery.appendChild(div);
}

function showImg(src){
    document.getElementById('modal').style.display='flex';
    document.getElementById('modalImg').src=src;
}

document.getElementById('modal').onclick=()=>{
    document.getElementById('modal').style.display='none';
}

</script>

</body>
</html>
